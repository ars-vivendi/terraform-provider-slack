name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate and normalize release tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$REQUESTED_TAG" =~ $semver || ( "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF_TYPE" != tag ) ]]; then
            printf 'Release requires a vMAJOR.MINOR.PATCH tag (optional semver prerelease).\n' >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\n' "$REQUESTED_TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a semver tag on merged default-branch history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Rerun format, generation, vet, tests and versioned build
        run: bash scripts/check.sh "$RELEASE_TAG"
      - name: Build embedded provider package and matching source
        run: |
          bash scripts/install-crossplane.sh
          bash scripts/install-crane.sh
          bash scripts/build-package.sh "$RELEASE_TAG"
          bash scripts/build-source.sh "$RELEASE_TAG"
      - name: Hash release artifacts
        working-directory: _output
        run: |
          sha256sum "terraform-provider-slack-$RELEASE_TAG-linux-amd64.xpkg" \
            "terraform-provider-slack-$RELEASE_TAG-source.tar.gz" > SHA256SUMS
      - name: Save release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-provider-slack-${{ env.RELEASE_TAG }}-linux-amd64
          path: |
            _output/terraform-provider-slack-${{ env.RELEASE_TAG }}-linux-amd64.xpkg
            _output/terraform-provider-slack-${{ env.RELEASE_TAG }}-source.tar.gz
            _output/SHA256SUMS
          if-no-files-found: error
      - name: Require publishing configuration
        env:
          UPBOUND_ORGANIZATION: ${{ vars.UPBOUND_ORGANIZATION }}
        run: |
          if [[ ! "$UPBOUND_ORGANIZATION" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]; then
            printf 'Set the UPBOUND_ORGANIZATION repository variable to the authorized Upbound namespace.\n' >&2
            exit 1
          fi
      - name: Log in with Upbound robot credentials
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_ROBOT_ACCESS_ID }}
          password: ${{ secrets.UPBOUND_ROBOT_TOKEN }}
      - name: Select verified existing assets or create a new GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_name="terraform-provider-slack-$RELEASE_TAG-linux-amd64.xpkg"
          source_name="terraform-provider-slack-$RELEASE_TAG-source.tar.gz"
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$remote_commit" == "$(git rev-parse HEAD)" ]]
          # Listing releases makes HTTP/authentication failures fatal, rather than treating them as absence.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > _output/releases.json
          release=$(jq -c --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate release tag") else .[0] end' \
            _output/releases.json)
          if [[ "$release" == null ]]; then
            flags=(--verify-tag --title "$RELEASE_TAG"
              --notes 'Linux/amd64 provider package with embedded runtime. Matching source with vendored dependencies and SHA256SUMS are attached.')
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
              "_output/$package_name" "_output/$source_name" _output/SHA256SUMS
            package_file="_output/$package_name"
          else
            jq -e --arg tag "$RELEASE_TAG" --arg package "$package_name" --arg source "$source_name" \
              '.tag_name == $tag and .draft == false and
               ([.assets[] | select(.size > 0) | .name] | contains([$package, $source, "SHA256SUMS"]))' \
              <<< "$release"
            mkdir _output/published-assets
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir _output/published-assets \
              --pattern "$package_name" --pattern "$source_name" --pattern SHA256SUMS
            # Require exactly one checksum for each original artifact before checking either file.
            mapfile -t checksums < _output/published-assets/SHA256SUMS
            [[ ${#checksums[@]} -eq 2 ]]
            for asset in "$package_name" "$source_name"; do
              count=0
              for entry in "${checksums[@]}"; do
                hash=${entry%"  $asset"}
                if [[ "$hash" =~ ^[a-f0-9]{64}$ && "$entry" == "$hash  $asset" ]]; then
                  count=$((count + 1))
                fi
              done
              [[ "$count" -eq 1 ]]
            done
            (cd _output/published-assets && sha256sum --check --strict SHA256SUMS)
            package_file="_output/published-assets/$package_name"
          fi
          printf 'PACKAGE_FILE=%s\n' "$package_file" >> "$GITHUB_ENV"
      - name: Publish and report registry manifest digest
        shell: bash
        env:
          UPBOUND_ORGANIZATION: ${{ vars.UPBOUND_ORGANIZATION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repository="xpkg.upbound.io/$UPBOUND_ORGANIZATION/terraform-provider-slack"
          ref="$repository:$RELEASE_TAG"
          _output/bin/crossplane xpkg push "$ref" \
            --package-files="$PACKAGE_FILE"
          digest=$(_output/bin/crane digest --platform=all "$ref")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Published: %s\nManifest digest: %s\nImmutable reference: %s@%s\n' \
            "$ref" "$digest" "$repository" "$digest"
          printf "Package: \`%s\`\n\nManifest digest: \`%s\`\n\nImmutable reference: \`%s@%s\`\n" \
            "$ref" "$digest" "$repository" "$digest" > _output/release-notes.md
          printf '\nMatching source with vendored dependencies and SHA256SUMS are attached to this release.\n' \
            >> _output/release-notes.md
          tee -a "$GITHUB_STEP_SUMMARY" < _output/release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file _output/release-notes.md
